project:
  name: "eeg-emotion-treatment"
  mode: "full-auto"

research:
  topic: "Dynamic graph neural networks for EEG-based emotion recognition: comparing dynamic graph construction (adaptive adjacency, temporal sliding-window graphs) against static predefined graphs on DEAP and SEED datasets"
  domains:
    - "neuroscience"
    - "deep-learning"
    - "affective-computing"
    - "graph-neural-networks"
  daily_paper_count: 10
  quality_threshold: 3.5

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 2
  approval_timeout_hours: 1
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "openai-compatible"
  base_url: "https://openai-api.shenmishajing.workers.dev/v1"
  api_key: "r685RxDQ3lYYWC8nOH5SUDlLZEkutddM"
  api_key_env: "RESEARCHCLAW_API_KEY"
  primary_model: "gpt-4o"
  fallback_models:
    - "gpt-4.1"

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: false

experiment:
  mode: "sandbox"
  time_budget_sec: 1800
  max_iterations: 5
  metric_key: "accuracy"
  metric_direction: "maximize"
  sandbox:
    python_path: "python3"  # uses PATH; override for cluster
    gpu_required: true
    max_memory_mb: 6144
    allowed_imports:
      - "numpy"
      - "scipy"
      - "matplotlib"
      - "torch"
      - "torch_geometric"
      - "sklearn"
      - "mne"
      - "pandas"
      - "json"
      - "time"
      - "os"
      - "sys"
      - "math"
      - "random"
      - "collections"
      - "itertools"
      - "functools"
      - "typing"
      - "dataclasses"
      - "pathlib"
      - "csv"
      - "pickle"
      - "h5py"

prompts:
  custom_file: ""

# Community knowledge ENABLED for treatment group
community:
  enabled: true
  seb_base_url: "http://localhost:8000"
  challenge_ids:
    - "9eaf81e7-d2d6-4440-a297-96d31c769665"
  related_discipline: "neuroscience"
  min_score: 5.0
  max_refine_rounds: 2
  refine_threshold: 8.0
